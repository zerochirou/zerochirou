name: Deploy Server API to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "apps/server/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/server/**"

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    name: Build and Deploy Server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and Lint Server
        run: |
          pnpm --filter server typecheck
          pnpm --filter server lint

      - name: Deploy Server Preview (Pull Request)
        if: github.event_name == 'pull_request'
        run: pnpm --filter server exec wrangler versions upload --message "PR #${{ github.event.pull_request.number }} Preview"

      - name: Deploy Server to Production (Main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter server deploy
