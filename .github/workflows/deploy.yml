name: Deploy OpenNext to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and Test Web
        run: |
          pnpm --filter web typecheck
          pnpm --filter web test

      - name: Build OpenNext
        run: pnpm --filter web build:opennext

      - name: Deploy Web Preview (Pull Request)
        if: github.event_name == 'pull_request'
        run: pnpm --filter web exec wrangler versions upload --message "PR-${{ github.event.pull_request.number }}-Preview"

      - name: Deploy to Cloudflare Workers (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter web deploy
